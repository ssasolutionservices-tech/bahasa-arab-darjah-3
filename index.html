<header class="name-bar" id="name-bar">
 <label for="student-name">Nama murid</label>
 <input type="text" id="student-name" name="student_name" placeholder="Isi nama anda" maxlength="120" autocomplete="name" enterkeyhint="done" required aria-describedby="name-error">
 <p class="name-error" id="name-error" role="alert"></p>
</header>
<main class="page-viewport" id="viewport" aria-label="Lembaran soalan"></main>
<nav class="navigation" aria-label="Navigasi soalan">
 <button type="button" id="back" hidden>Back</button>
 <button type="button" id="advance" class="primary">Next</button>
</nav>
<div class="pickbar" id="pickbar" hidden>
 <span id="pick-preview" class="pick-preview" aria-hidden="true"></span>
 <p>Tekan ruang jawapan atau seret ke ruangnya.</p>
 <button type="button" id="remove" hidden>Keluarkan</button>
 <button type="button" id="cancel">Batal</button>
</div>
<dialog class="results" id="results" aria-labelledby="results-title" aria-describedby="result-name result-score result-detail">
 <h1 id="results-title">Keputusan</h1>
 <p class="label">Nama murid</p>
 <p class="result-name" id="result-name"></p>
 <p class="label">Markah keseluruhan</p>
 <p class="result-score" id="result-score"><strong id="marks">0</strong><span> / <span id="max-marks">30</span></span></p>
 <p class="result-detail" id="result-detail"></p>
 <p class="result-detail" id="result-unanswered" hidden></p>
 <button type="button" class="primary" id="close-results" autofocus>Tutup</button>
</dialog>
<p class="sr-only" id="announce" aria-live="polite" aria-atomic="true"></p>

const KEY = 'latihan-arab-soalan-asal-v2';
const OLD_KEY = 'latihan-arab-soalan-asal-v1';
const NS = 'http://www.w3.org/2000/svg';
const TOKENS = new Map();
const QUESTIONS = new Map();
PAGES.forEach(p => {
 p.tokens.forEach(t => {t.page = p; TOKENS.set(t.id,t);});
 p.questions.forEach(q => {q.page = p; QUESTIONS.set(q.id,q);});
});

function compatible(tokenId, questionId) {
 const t = TOKENS.get(tokenId), q = QUESTIONS.get(questionId);
 return Boolean(t && q && t.page.id === q.page.id && (!t.group || t.group === q.id));
}
function sanitizeAnswers(raw) {
 const clean = {}, used = new Set();
 if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return clean;
 for (const [id, tokenId] of Object.entries(raw)) {
  if (typeof tokenId === 'string' && compatible(tokenId,id) && !used.has(tokenId)) {
   clean[id] = tokenId; used.add(tokenId);
  }
 }

}
function normalizeName(name) {return typeof name==='string' ? name.replace(/\s+/g,' ').trim().slice(0,120) : '';}

 try {
  let saved=JSON.parse(localStorage.getItem(KEY) || 'null');
  if(!saved){
   const old=JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
   if(old){
    const migrated={};
    QUESTIONS.forEach(q=>{if(old.answers?.[q.originalId])migrated[q.id]=old.answers[q.originalId];});
    saved={answers:migrated,page:old.page,name:'',submitted:false};
   }
  }
  const name=normalizeName(saved?.name);
  return {answers:sanitizeAnswers(saved?.answers),page:Number.isInteger(saved?.page) && saved.page>=0 && saved.page<PAGES.length ? saved.page : 0,name,submitted:Boolean(saved?.submitted===true && name)};

}

 if (!compatible(tokenId,questionId)) return null;
 const next = {...answers};
 const previousId = Object.keys(next).find(id => next[id] === tokenId);
 if (previousId === questionId) return next;

  if (answers[q.id] === q.answer) {correct++;marks += q.page.points;}
 });
 return {answered,correct,marks,total:QUESTIONS.size,maxMarks:PAGES.reduce((s,p) => s+p.points*p.questions.length,0)};
}
function position(el,box,p) {
 el.style.left = box[0]/p.width*100+'%'; el.style.top = box[1]/p.height*100+'%';
 el.style.width = box[2]/p.width*100+'%'; el.style.height = box[3]/p.height*100+'%';
}
function ink(tokenId) {
 const t = TOKENS.get(tokenId), p = t.page;
 const svg = document.createElementNS(NS,'svg');
 svg.classList.add('ink'); svg.setAttribute('viewBox',t.crop.join(' '));
 svg.setAttribute('preserveAspectRatio','xMidYMid meet');
 svg.setAttribute('aria-hidden','true'); svg.setAttribute('focusable','false');
 const image = document.createElementNS(NS,'image');
 image.setAttribute('href',p.image);image.setAttribute('width',p.width);image.setAttribute('height',p.height);
 svg.append(image);return svg;
}
// The original Arabic-Indic digits and parenthesis, copied without redrawing.
const NUMBER_GLYPHS={
 '(': [921,476,9,36], '0':[690,1233,7,36], '1':[955,476,10,36],
 '2':[669,478,15,36], '3':[379,477,20,36], '4':[933,476,15,36],
 '5':[671,742,16,36], '6':[393,743,17,36], '7':[968,989,19,36],
 '8':[684,990,19,36], '9':[397,992,17,36]
};
function questionNumber(q) {
 const box=q.numberBox,p=PAGES[0],scale=q.numberHeight/36,gap=3*scale;
 const svg=document.createElementNS(NS,'svg');svg.classList.add('number-mask');
 svg.setAttribute('viewBox',`0 0 ${box[2]} ${box[3]}`);svg.setAttribute('aria-hidden','true');svg.setAttribute('focusable','false');
 position(svg,box,q.page);
 const white=document.createElementNS(NS,'rect');white.setAttribute('width',box[2]);white.setAttribute('height',box[3]);white.setAttribute('fill','#fff');svg.append(white);
 const chars=['(',...q.id],width=chars.reduce((s,c)=>s+NUMBER_GLYPHS[c][2]*scale,0)+gap*(chars.length-1);
 let x=(box[2]-width)/2;
 for(const c of chars){
  const crop=NUMBER_GLYPHS[c],glyph=document.createElementNS(NS,'svg');
  glyph.setAttribute('x',x);glyph.setAttribute('y',(box[3]-q.numberHeight)/2);
  glyph.setAttribute('width',crop[2]*scale);glyph.setAttribute('height',q.numberHeight);glyph.setAttribute('viewBox',crop.join(' '));
  const im=document.createElementNS(NS,'image');im.setAttribute('href',p.image);im.setAttribute('width',p.width);im.setAttribute('height',p.height);glyph.append(im);svg.append(glyph);
  x+=crop[2]*scale+gap;
 }
 return svg;
}
function buildPages() {
 PAGES.forEach((p,i) => {
  const section = document.createElement('section');section.className='sheet';section.id=p.id;
  section.setAttribute('aria-label',`Halaman ${p.step}: ${p.label}`);section.hidden=i!==state.page;
  const img = document.createElement('img');img.className='scan';img.src=p.image;img.width=p.width;img.height=p.height;img.draggable=false;
  img.alt=`Halaman ${p.step}, ${p.label}. Jawab menggunakan pilihan dan ruang interaktif pada halaman ini.`;
  section.append(img);
  const overlay = document.createElement('div');overlay.className='overlay';
  p.questions.forEach(q=>overlay.append(questionNumber(q)));
  p.tokens.forEach(t => {
   const b=document.createElement('button');b.type='button';b.className='hotspot source';b.dataset.token=t.id;
   b.setAttribute('aria-label',`Pilihan ${t.label}${t.group ? ', soalan '+t.group : ''}`);b.setAttribute('aria-pressed','false');
   b.title=`Pilih atau seret: ${t.label}`;position(b,t.box,p);overlay.append(b);sourceNodes.set(t.id,b);
  });
  p.questions.forEach(q => {
   const b=document.createElement('button');b.type='button';b.className='hotspot drop';b.dataset.question=q.id;b.dataset.shape=q.shape;
   b.setAttribute('aria-label',`Soalan ${q.id}: ${q.prompt}. Ruang jawapan kosong.`);
   b.title=`Ruang jawapan soalan ${q.id}`;position(b,q.box,p);overlay.append(b);dropNodes.set(q.id,b);
  });
  section.append(overlay);viewport.append(section);
 });
}
function render() {
 if($('student-name').value!==state.name)$('student-name').value=state.name;
 $('back').hidden=state.page===0;
 $('advance').textContent=state.page===PAGES.length-1?'Submit':'Next';
 $('advance').setAttribute('aria-label',state.page===PAGES.length-1?'Submit dan lihat markah keseluruhan':'Next: halaman seterusnya');
 PAGES.forEach((page,i)=>{$(page.id).hidden=i!==state.page;});
 sourceNodes.forEach((b,id)=>{
  b.classList.toggle('used',Boolean(ownerOf(id)));b.classList.toggle('selected',selected===id);
  b.setAttribute('aria-pressed',selected===id?'true':'false');
 });
 dropNodes.forEach((b,id)=>{
  const value=state.answers[id],q=QUESTIONS.get(id);
  if(b.dataset.value !== (value || '')){b.replaceChildren();if(value)b.append(ink(value));b.dataset.value=value || '';}
  b.classList.toggle('filled',Boolean(value));b.classList.toggle('selected',Boolean(value && value===selected));
  b.classList.toggle('ready',Boolean(selected && compatible(selected,id)));
  b.classList.toggle('correct',Boolean(state.submitted && value===q.answer));
  b.classList.toggle('incorrect',Boolean(state.submitted && value && value!==q.answer));
  b.classList.toggle('unanswered',Boolean(state.submitted && !value));
  const result=state.submitted ? (value===q.answer ? ' Betul.' : value ? ' Belum betul.' : ' Belum dijawab.') : '';
  b.setAttribute('aria-label',`Soalan ${id}: ${q.prompt}. ${value ? 'Jawapan '+TOKENS.get(value).label : 'Ruang jawapan kosong.'}${result}`);
  if(state.submitted && value && value!==q.answer)b.setAttribute('aria-invalid','true');else b.removeAttribute('aria-invalid');
 });
 $('pickbar').hidden=!selected;
 if(selected){$('pick-preview').replaceChildren(ink(selected));$('remove').hidden=!ownerOf(selected);}
 save();
}
function pick(tokenId) {
 selected=selected===tokenId?null:tokenId;render();
 announce(selected ? `Dipilih: ${TOKENS.get(selected).label}. Tekan ruang jawapan.` : 'Pilihan dibatalkan.');
}
function assign(tokenId,questionId) {
 const next=placeToken(state.answers,tokenId,questionId);
 if(!next){announce('Pilih jawapan yang disediakan pada halaman dan baris soalan ini.');return false;}
 state.answers=next;state.submitted=false;selected=null;render();announce(`Jawapan diletakkan pada soalan ${questionId}.`);return true;
}
function removeToken(tokenId) {
 const id=ownerOf(tokenId);if(id)delete state.answers[id];state.submitted=false;selected=null;render();
 if(id)announce(`Jawapan soalan ${id} dikosongkan.`);
}
function changePage(index) {
 if(!Number.isInteger(index)||index<0||index>=PAGES.length)return;
 endDrag();selected=null;state.page=index;render();viewport.scrollLeft=0;
 window.scrollTo({top:0,behavior:'auto'});
}
function updateHover(x,y) {
 if(hoverDrop)hoverDrop.classList.remove('over');
 const el=document.elementFromPoint(x,y)?.closest('[data-question]');
 hoverDrop=el && pointer && compatible(pointer.tokenId,el.dataset.question) ? el:null;
 if(hoverDrop)hoverDrop.classList.add('over');
}
function moveGhost(x,y) {if(ghost){ghost.style.left=x+'px';ghost.style.top=y+'px';}}
function autoScroll() {
 if(!pointer?.dragging)return;
 const p=pointer;
 const top=55, bottom=window.innerHeight-65;
 const dy=p.y>bottom?Math.min(19,(p.y-bottom)*.3):p.y<top?-Math.min(19,(top-p.y)*.3):0;
 if(dy)window.scrollBy(0,dy);
 const r=viewport.getBoundingClientRect(),left=Math.max(0,r.left)+40,right=Math.min(innerWidth,r.right)-40;
 if(p.x>right)viewport.scrollLeft+=Math.min(16,(p.x-right)*.3);
 else if(p.x<left)viewport.scrollLeft-=Math.min(16,(left-p.x)*.3);
 updateHover(p.x,p.y);scrollFrame=requestAnimationFrame(autoScroll);
}
function startDrag() {
 pointer.dragging=true;selected=pointer.tokenId;render();$('pickbar').classList.add('drag-active');
 pointer.el.classList.add('dragging');
 ghost=document.createElement('div');ghost.className='drag-ghost';ghost.setAttribute('aria-hidden','true');
 const t=TOKENS.get(pointer.tokenId),scale=$(t.page.id).getBoundingClientRect().width/t.page.width;
 const height=Math.min(77,Math.max(46,t.crop[3]*scale+12));
 ghost.style.height=height+'px';ghost.style.width=Math.max(58,Math.min(175,(height-10)*t.crop[2]/t.crop[3]+12))+'px';
 ghost.append(ink(pointer.tokenId));document.body.append(ghost);moveGhost(pointer.x,pointer.y);
 scrollFrame=requestAnimationFrame(autoScroll);
}
function endDrag() {
 cancelAnimationFrame(scrollFrame);scrollFrame=0;
 if(hoverDrop)hoverDrop.classList.remove('over');hoverDrop=null;
 if(ghost)ghost.remove();ghost=null;
 if(pointer){pointer.el.classList.remove('dragging');try{if(pointer.el.hasPointerCapture(pointer.id))pointer.el.releasePointerCapture(pointer.id);}catch{}}
 pointer=null;$('pickbar').classList.remove('drag-active');
}
viewport.addEventListener('pointerdown',e=>{
 if(e.button!==0 || e.isPrimary===false || pointer)return;
 const el=e.target.closest('.hotspot');if(!el)return;
 const tokenId=el.dataset.token || state.answers[el.dataset.question];if(!tokenId)return;
 pointer={id:e.pointerId,tokenId,el,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,dragging:false};
 try{el.setPointerCapture(e.pointerId);}catch{}
});
document.addEventListener('pointermove',e=>{
 if(!pointer || pointer.id!==e.pointerId)return;
 pointer.x=e.clientX;pointer.y=e.clientY;
 if(!pointer.dragging && Math.hypot(e.clientX-pointer.startX,e.clientY-pointer.startY)>7)startDrag();
 if(pointer.dragging){e.preventDefault();moveGhost(e.clientX,e.clientY);updateHover(e.clientX,e.clientY);}
},{passive:false});
document.addEventListener('pointerup',e=>{
 if(!pointer || pointer.id!==e.pointerId)return;
 if(pointer.dragging){
  suppressClickUntil=Date.now()+450;
  const el=document.elementFromPoint(e.clientX,e.clientY),q=el?.closest('[data-question]'),source=el?.closest('[data-token]');
  if(q)assign(pointer.tokenId,q.dataset.question);
  else if(source && TOKENS.get(source.dataset.token).page.id===TOKENS.get(pointer.tokenId).page.id && ownerOf(pointer.tokenId))removeToken(pointer.tokenId);
  else announce('Jawapan belum dipindahkan. Lepaskan pada ruang jawapan.');
 }
 endDrag();
});
document.addEventListener('pointercancel',()=>endDrag());
window.addEventListener('blur',()=>endDrag());
viewport.addEventListener('lostpointercapture',()=>{if(pointer)endDrag();});
viewport.addEventListener('dragstart',e=>e.preventDefault());
viewport.addEventListener('click',e=>{
 if(Date.now()<suppressClickUntil){e.preventDefault();return;}
 const el=e.target.closest('.hotspot');if(!el)return;
 if(el.dataset.token){pick(el.dataset.token);return;}
 const id=el.dataset.question;
 if(selected)assign(selected,id);
 else if(state.answers[id])pick(state.answers[id]);
 else announce('Tekan satu pilihan jawapan dahulu, kemudian tekan ruang kosong ini.');
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){endDrag();selected=null;render();}
 if((e.key==='Delete'||e.key==='Backspace') && e.target.matches('[data-question]')){
  e.preventDefault();const tokenId=state.answers[e.target.dataset.question];if(tokenId)removeToken(tokenId);
 }
});
function requireName() {
 const name=normalizeName($('student-name').value);
 if(!name){
  $('name-error').textContent='Sila isi nama anda dahulu.';
  $('student-name').setAttribute('aria-invalid','true');
  $('student-name').focus();$('name-bar').scrollIntoView({block:'start',behavior:'auto'});
  return false;
 }
 state.name=name;$('student-name').value=name;
 $('name-error').textContent='';$('student-name').removeAttribute('aria-invalid');
 return true;
}
function submitQuiz() {
 if(state.page!==PAGES.length-1 || !requireName())return false;
 endDrag();selected=null;state.submitted=true;render();
 const score=scores(state.answers);
 $('result-name').textContent=state.name;
 $('marks').textContent=String(score.marks);$('max-marks').textContent=String(score.maxMarks);
 $('result-detail').textContent=`${score.correct} daripada ${score.total} jawapan betul.`;
 $('result-unanswered').hidden=score.answered===score.total;
 $('result-unanswered').textContent=`Belum dijawab: ${score.total-score.answered}.`;
 const dialog=$('results');
 if(typeof dialog.showModal==='function'){if(!dialog.open)dialog.showModal();}
 else{dialog.classList.add('fallback');dialog.setAttribute('open','');}
 $('close-results').focus();
 return true;
}
function closeResults() {
 const dialog=$('results');
 if(typeof dialog.close==='function')dialog.close();else dialog.removeAttribute('open');
 $('advance').focus();
}
$('student-name').addEventListener('input',()=>{
 state.name=$('student-name').value.slice(0,120);state.submitted=false;
 $('name-error').textContent='';$('student-name').removeAttribute('aria-invalid');render();
});
$('student-name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('student-name').blur();}});
$('advance').addEventListener('click',()=>{
 if(!requireName())return;
 if(state.page<PAGES.length-1)changePage(state.page+1);else submitQuiz();
});
$('back').addEventListener('click',()=>{if(state.page>0)changePage(state.page-1);});
$('close-results').addEventListener('click',closeResults);
$('cancel').addEventListener('click',()=>{selected=null;render();});
$('remove').addEventListener('click',()=>{if(selected)removeToken(selected);});
buildPages();render();
</script>
</body>
</html>
